version: '3.8'

services:
  vote:
    image: dockersamples/examplevotingapp_vote:latest
    container_name: vote
    ports:
      - "5000:80"
    restart: always
    networks:
      - vote_network
    depends_on:
      - redis

  result:
    image: dockersamples/examplevotingapp_result:latest
    container_name: result
    ports:
      - "5001:80"
    restart: always
    networks:
      - vote_network
    depends_on:
      - postgres

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - vote_network

  worker:
    image: dockersamples/examplevotingapp_worker:latest
    container_name: worker
    restart: always
    networks:
      - vote_network
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:13
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: votes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vote_network

volumes:
  postgres_data:

networks:
  vote_network: